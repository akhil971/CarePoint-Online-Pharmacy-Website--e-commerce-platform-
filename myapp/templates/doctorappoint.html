{% extends 'base.html' %}
{% load static %}
{% block title %}
appointment_page
{% endblock %}

{% block body %}
<section class="consultation py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="consult-box">

                    <div class="text-center mb-4">
                        <h2>Book a Consultation</h2>
                        <p>Fill in your details and our doctor will contact you shortly.</p>
                    </div>

                    <form action="{% url 'doctorappoint' %}" method="post">
                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label>Full Name</label>
                                <input type="text" name="full_name" class="form-control" placeholder="Enter your name" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Phone Number</label>
                                <input type="tel" name="phone_number" class="form-control" placeholder="Enter phone number" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Email</label>
                                <input type="email" name="email" class="form-control" placeholder="Enter email">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Age</label>
                                <input type="number" name="age" class="form-control" placeholder="Enter age" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Gender</label>
                                <select name="gender" class="form-select" required>
                                    <option selected disabled value="">Select Gender</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                    <option>Other</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Select Doctor</label>
                                <select name="doctor" class="form-select" required>
                                    <option selected disabled value="">Select Doctor</option>
                                    <option>General Physician</option>
                                    <option>Cardiologist</option>
                                    <option>Dermatologist</option>
                                    <option>Orthopedic</option>
                                    <option>Pediatrician</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Appointment Date</label>
                                <input type="date" name="appointment_date" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Preferred Time</label>
                                <input type="time" name="appointment_time" class="form-control" required>
                            </div>

                            <div class="col-12 mb-3">
                                <label>Describe Your Problem</label>
                                <textarea name="problem_description" class="form-control" rows="5" placeholder="Write your health concern..." required></textarea>
                            </div>

                            <div class="col-12 text-center">

                                <button class="btn btn-success px-5 py-2">
                                    Book Appointment
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
{% endblock %}
